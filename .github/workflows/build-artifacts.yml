name: Build and Package App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not cancel the other two — a broken macOS
      # build should still leave usable Windows and Linux artifacts.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build and Package
        env:
          # Disable Apple signing identity auto-discovery for local/test build runs
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Ensure GitHub Token is available if needed by electron-builder
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run package

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ns-ventures-mac
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/latest-mac.yml
          if-no-files-found: error

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ns-ventures-windows
          path: |
            release/build/*.exe
            release/build/*.blockmap
            release/build/latest.yml
          if-no-files-found: error

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ns-ventures-linux
          path: |
            release/build/*.AppImage
            release/build/*.deb
            release/build/latest-linux.yml
          if-no-files-found: error
